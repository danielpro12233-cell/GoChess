name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Find the app folder
        run: |
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "MOBILE=$(dirname "$CFG")" >> $GITHUB_ENV
      - name: Install and add Android
        working-directory: ${{ env.MOBILE }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Use the Gochess icon
        working-directory: ${{ env.MOBILE }}
        run: |
          RES=android/app/src/main/res
          ICONS=../public/icons
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            mkdir -p $RES/mipmap-$n
            convert $ICONS/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert $ICONS/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            convert $ICONS/maskable-512.png -resize ${f}x${f} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#111411</color></resources>' > $RES/values/ic_launcher_background.xml
      - name: Build the APK
        working-directory: ${{ env.MOBILE }}/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gochess-APK
          path: ${{ env.MOBILE }}/android/app/build/outputs/apk/debug/app-debug.apk
